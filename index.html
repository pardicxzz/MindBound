        let t = 0; const N = hard ? 6 : 5, well = { x:50, y:60 }, rocks = [];
        const layout = () => {
            well.x = 100 + 50 * Math.cos(0.9 * t + Math.PI); well.y = 60 + 28 * Math.sin(1.3 * t);
            rocks.length = 0;
            for (let k = 0; k < N; k++) { const a = 2.2 * t + k * 6.2832 / N; rocks.push({ x: well.x + Math.cos(a) * 34, y: well.y + Math.sin(a) * 34 }); }
        };
        layout();
        return {
            label: '¡Resiste la gravedad!', dmg: 8, grace: 0.8,
            update(dt) { t += dt; layout(); },
            push(hx, hy) {                                   // fuerza que arrastra al corazón (px/s)
                const dx = well.x - hx, dy = well.y - hy, d = Math.max(8, Math.hypot(dx, dy));
                const f = Math.min(hard ? 100 : 85, (hard ? 3200 : 2700) / d);
                return { x: dx / d * f, y: dy / d * f };
            },
            hit: (hx, hy) => circHit(well.x, well.y, 9, hx, hy) || rocks.some(r => circHit(r.x, r.y, 4.5, hx, hy)),
            draw(c, ox, oy) {
                c.strokeStyle = 'rgba(180,140,255,0.22)'; c.lineWidth = 1; c.setLineDash([3, 4]);
                c.beginPath(); c.arc(ox + well.x, oy + well.y, 34, 0, 7); c.stroke(); c.setLineDash([]);
                for (let k = 1; k <= 3; k++) { c.strokeStyle = `rgba(150,100,255,${(0.35 - k * 0.09).toFixed(2)})`; c.beginPath(); c.arc(ox + well.x, oy + well.y, 9 + ((t * 24 + k * 10) % 30), 0, 7); c.stroke(); }
                c.fillStyle = '#1a0a2e'; c.strokeStyle = '#b080ff'; c.lineWidth = 2;
                c.beginPath(); c.arc(ox + well.x, oy + well.y, 9, 0, 7); c.fill(); c.stroke();
                for (const r of rocks) { c.fillStyle = '#8a7a6a'; c.strokeStyle = '#2a2018'; c.lineWidth = 1.5; c.beginPath(); c.arc(ox + r.x, oy + r.y, 4.5, 0, 7); c.fill(); c.stroke(); }
            }
        };
    };

    // Tormenta: relámpagos que caen en zigzag, avisados por una nube
    ATTACKS.stormBolts = hard => {
        let timer = 0.4; const bolts = [];
        return {
            label: '¡Esquiva los relámpagos!', dmg: 8, grace: 0.5,
            update(dt, t, hx) {
                timer -= dt;
                if (timer <= 0) {
                    timer = hard ? 0.62 : 0.85;
                    const n = (hard && Math.random() < 0.5) ? 2 : 1;
                    for (let i = 0; i < n; i++) bolts.push({ x: Math.random() < 0.6 ? aclamp(hx + arnd(-18, 18), 10, BOX_W - 10) : arnd(10, BOX_W - 10), warn: 0.6, fire: 0.22 });
                }
                for (let i = bolts.length - 1; i >= 0; i--) {
                    const b = bolts[i];
                    if (b.warn > 0) b.warn -= dt; else b.fire -= dt;
                    if (b.fire <= 0) bolts.splice(i, 1);
                }
            },
            hit: (hx) => bolts.some(b => b.warn <= 0 && b.fire > 0 && Math.abs(hx - b.x) < 6 + HEART_R),
            draw(c, ox, oy) {
                for (const b of bolts) {
                    if (b.warn > 0) {
                        c.fillStyle = 'rgba(120,120,150,0.8)'; c.beginPath(); c.arc(ox + b.x - 6, oy + 7, 7, 0, 7); c.arc(ox + b.x + 6, oy + 7, 7, 0, 7); c.arc(ox + b.x, oy + 3, 8, 0, 7); c.fill();
                        c.strokeStyle = Math.floor(b.warn * 14) % 2 ? '#ffe070' : '#9ab8ff'; c.lineWidth = 1.5; c.setLineDash([3, 5]);
                        line(c, ox, oy, b.x, 14, b.x, BOX_H); c.setLineDash([]);
                    } else {
                        const pts = []; for (let y = 0; y <= BOX_H; y += 12) pts.push([b.x + (y === 0 || y >= BOX_H ? 0 : arnd(-6, 6)), y]);
                        for (const [col, w] of [['rgba(120,170,255,0.5)', 12], ['#ffffff', 4]]) {
                            c.strokeStyle = col; c.lineWidth = w; c.lineJoin = 'miter'; c.beginPath();
                            pts.forEach(([x, y], i) => i ? c.lineTo(ox + x, oy + y) : c.moveTo(ox + x, oy + y)); c.stroke();
                        }
                    }
                }
            }
        };
    };

    // ════════════════ ATAQUES NUEVOS: 10 MÁS POR MATERIA (40 en total) ════════════════
    // Se construyen con unas pocas "fábricas" (caer, franjas avisadas, zonas, rebotes, órbitas,
    // perseguidores, muros con hueco, ráfagas y ondas); cada ataque les pone su tema y su dibujo.
    const A_DIR = { down:[0, 1], up:[0, -1], left:[-1, 0], right:[1, 0] };
    const aIn = (x, y, m) => x > -m && x < BOX_W + m && y > -m && y < BOX_H + m;
    const gl = (c, ch, x, y, col, px = 15, rot = 0) => {
        c.save(); c.translate(x, y); if (rot) c.rotate(rot);
        c.font = `bold ${px}px monospace`; c.textAlign = 'center'; c.textBaseline = 'middle';
        outlineText(c, ch, 0, 0, col); c.restore();
    };
    const disc = (c, x, y, r, fill, stroke) => { c.beginPath(); c.arc(x, y, r, 0, 7); c.fillStyle = fill; c.fill(); if (stroke) { c.strokeStyle = stroke; c.lineWidth = 1.5; c.stroke(); } };
    const blink = () => 0.5 + 0.5 * Math.sin(performance.now() / 60);
    function warnRing(c, x, y, r, z, col) {          // aviso de una zona: anillo que se cierra
        const k = Math.max(0, z.warn) / (z.w0 || 0.7);
        c.strokeStyle = col; c.lineWidth = 2; c.setLineDash([4, 4]);
        c.beginPath(); c.arc(x, y, r, 0, 7); c.stroke(); c.setLineDash([]);
        c.fillStyle = col.replace(')', ',' + (0.12 + 0.18 * blink()).toFixed(2) + ')').replace('rgb', 'rgba');
        c.beginPath(); c.arc(x, y, r * (1 - k * 0.6), 0, 7); c.fill();
    }

    // ── caer / cruzar la caja ──
    function atkFall(cfg) {
        return hard => {
            const n = hard ? Math.ceil(cfg.n * 1.25) : cfg.n, sp = hard ? 1.2 : 1, dirs = cfg.dirs || ['down'];
            let tm = 0;
            const mk = first => {
                const d = dirs[aint(0, dirs.length - 1)], [dx, dy] = A_DIR[d];
                const it = { dx, dy, v: arnd(cfg.v[0], cfg.v[1]) * sp, r: cfg.r, ph: arnd(0, 6.28), rot: arnd(-0.6, 0.6), k: aint(0, 11) };
                const lag = arnd(0, first ? 120 : 30) + 8;
                if (dx === 0) { it.bx = arnd(8, BOX_W - 8); it.by = dy > 0 ? -lag : BOX_H + lag; }
                else          { it.by = arnd(8, BOX_H - 8); it.bx = dx > 0 ? -lag : BOX_W + lag; }
                it.x = it.bx; it.y = it.by; return it;
            };
            const items = Array.from({ length: n }, () => mk(true));
            return {
                label: cfg.label, dmg: cfg.dmg || 8, grace: cfg.grace || 0.5,
                update(dt) {
                    tm += dt;
                    for (const it of items) {
                        it.bx += it.dx * it.v * dt; it.by += it.dy * it.v * dt;
                        const w = cfg.wob ? Math.sin(tm * cfg.wob[1] + it.ph) * cfg.wob[0] : 0;
                        it.x = it.bx + (it.dx === 0 ? w : 0); it.y = it.by + (it.dy === 0 ? w : 0);
                        if ((it.dy > 0 && it.by > BOX_H + 10) || (it.dy < 0 && it.by < -10) || (it.dx > 0 && it.bx > BOX_W + 10) || (it.dx < 0 && it.bx < -10)) Object.assign(it, mk(false));
                    }
                },
                hit: (hx, hy) => items.some(it => aIn(it.x, it.y, 2) && circHit(it.x, it.y, it.r, hx, hy)),
                draw(c, ox, oy) { for (const it of items) if (aIn(it.x, it.y, 14)) cfg.draw(c, ox + it.x, oy + it.y, it, tm); }
            };
        };
    }

    // ── franjas avisadas (filas / columnas) ──
    function atkLanes(cfg) {
        return hard => {
            let timer = cfg.first || 0.4, tm = 0; const zs = [], T = cfg.th;
            return {
                label: cfg.label, dmg: cfg.dmg || 8, grace: cfg.grace || 0.5,
                update(dt, _t, hx, hy) {
                    tm += dt; timer -= dt;
                    if (timer <= 0) {
                        timer = cfg.gap * (hard ? 0.8 : 1);
                        const n = (hard && Math.random() < 0.45) ? 2 : 1;
                        for (let i = 0; i < n; i++) {
                            const horiz = cfg.o === 'h' || (cfg.o === 'hv' && Math.random() < 0.5), along = horiz ? hy : hx, lim = horiz ? BOX_H : BOX_W;
                            const p = Math.random() < 0.55 ? aclamp(along + arnd(-14, 14), T / 2, lim - T / 2) : arnd(T / 2, lim - T / 2);
                            zs.push({ horiz, p, warn: cfg.warn, w0: cfg.warn, fire: cfg.fire });
                        }
                    }
                    for (let i = zs.length - 1; i >= 0; i--) { const z = zs[i]; if (z.warn > 0) z.warn -= dt; else z.fire -= dt; if (z.fire <= 0) zs.splice(i, 1); }
                },
                hit: (hx, hy) => zs.some(z => z.warn <= 0 && z.fire > 0 && Math.abs((z.horiz ? hy : hx) - z.p) < T / 2 + HEART_R - 1),
                draw(c, ox, oy) {
                    for (const z of zs) {
                        const rx = z.horiz ? ox : ox + z.p - T / 2, ry = z.horiz ? oy + z.p - T / 2 : oy, rw = z.horiz ? BOX_W : T, rh = z.horiz ? T : BOX_H;
                        if (z.warn > 0) { c.fillStyle = `rgba(255,70,70,${(0.1 + 0.14 * blink()).toFixed(2)})`; c.fillRect(rx, ry, rw, rh); gl(c, '!', z.horiz ? ox + 10 : ox + z.p, z.horiz ? oy + z.p : oy + 10, '#ff5a5a', 14); }
                        else cfg.beam(c, rx, ry, rw, rh, z, tm);
                    }
                }
            };
        };
    }

    // ── zonas que explotan tras un aviso ──
    function atkZones(cfg) {
        return hard => {
            let timer = cfg.first || 0.5, tm = 0; const zs = [];
            return {
                label: cfg.label, dmg: cfg.dmg || 8, grace: cfg.grace || 0.6,
                update(dt, _t, hx, hy) {
                    tm += dt; timer -= dt;
                    if (timer <= 0) {
                        timer = cfg.gap * (hard ? 0.76 : 1);
                        const n = hard ? cfg.n + 1 : cfg.n;
                        for (let i = 0; i < n; i++) {
                            const near = i === 0 || Math.random() < 0.4;
                            zs.push({ x: near ? aclamp(hx + arnd(-26, 26), 12, BOX_W - 12) : arnd(12, BOX_W - 12), y: near ? aclamp(hy + arnd(-26, 26), 12, BOX_H - 12) : arnd(12, BOX_H - 12),
                                      r: cfg.r * (hard ? 1.12 : 1), warn: cfg.warn, w0: cfg.warn, fire: cfg.fire, f0: cfg.fire });
                        }
                    }
                    for (let i = zs.length - 1; i >= 0; i--) { const z = zs[i]; if (z.warn > 0) z.warn -= dt; else z.fire -= dt; if (z.fire <= 0) zs.splice(i, 1); }
                },
                hit: (hx, hy) => zs.some(z => z.warn <= 0 && z.fire > 0 && circHit(z.x, z.y, z.r, hx, hy)),
                draw(c, ox, oy) { for (const z of zs) cfg.draw(c, ox + z.x, oy + z.y, z, tm); }
            };
        };
    }

    // ── bolas que rebotan (con o sin gravedad) ──
    function atkBounce(cfg) {
        return hard => {
            const n = hard ? cfg.n + 2 : cfg.n, g = cfg.g || 0, balls = []; let tm = 0;
            while (balls.length < n) {
                const x = arnd(10, BOX_W - 10), y = arnd(8, BOX_H - 34);
                if (Math.hypot(x - BOX_W / 2, y - BOX_H / 2) < 44) continue;
                const a = arnd(0, 6.283), sp = arnd(cfg.v[0], cfg.v[1]) * (hard ? 1.15 : 1);
                balls.push({ x, y, vx: Math.cos(a) * sp, vy: g ? -Math.abs(Math.sin(a)) * sp * 0.5 : Math.sin(a) * sp, ph: arnd(0, 6), k: balls.length });
            }
            return {
                label: cfg.label, dmg: cfg.dmg || 8, grace: cfg.grace || 0.6,
                update(dt) {
                    tm += dt; const r = cfg.r;
                    for (const b of balls) {
                        if (g) b.vy += g * dt;
                        b.x += b.vx * dt; b.y += b.vy * dt;
                        if (b.x < r)         { b.x = r;         b.vx =  Math.abs(b.vx); }
                        if (b.x > BOX_W - r) { b.x = BOX_W - r; b.vx = -Math.abs(b.vx); }
                        if (b.y < r)         { b.y = r;         b.vy =  Math.abs(b.vy); }
                        if (b.y > BOX_H - r) { b.y = BOX_H - r; b.vy = -Math.abs(b.vy) * (g ? 0.93 : 1); if (g && Math.abs(b.vy) < 80) b.vy = -arnd(120, 175); }
                    }
                },
                hit: (hx, hy) => balls.some(b => circHit(b.x, b.y, cfg.r - 0.5, hx, hy)),
                draw(c, ox, oy) { for (const b of balls) cfg.draw(c, ox + b.x, oy + b.y, b, tm); }
            };
        };
    }

    // ── brazos que giran u oscilan alrededor de un centro ──
    function atkOrbit(cfg) {
        return hard => {
            let tm = 0, ang = arnd(0, 6.283);
            const arms = cfg.arms, w = cfg.w * (hard ? 1.15 : 1), nPer = Math.floor((cfg.len - (cfg.r0 || 16)) / cfg.step) + 1, pts = [];
            const compute = () => {
                pts.length = 0;
                const cx = (cfg.cx ?? BOX_W / 2) + (cfg.drift ? Math.sin(tm * 0.8) * cfg.drift : 0), cy = (cfg.cy ?? BOX_H / 2) + (cfg.drift ? Math.cos(tm * 0.6) * cfg.drift * 0.6 : 0);
                for (let a = 0; a < arms; a++) {
                    const base = cfg.swing ? cfg.base + Math.sin(tm * w) * cfg.swing + a * (cfg.armGap || 0) : ang + a * 6.283 / arms;
                    for (let k = 0; k < nPer; k++) { const r = (cfg.r0 || 16) + k * cfg.step; pts.push({ x: cx + Math.cos(base) * r, y: cy + Math.sin(base) * r, a: base, k, arm: a }); }
                }
            };
            compute();
            return {
                label: cfg.label, dmg: cfg.dmg || 8, grace: cfg.grace || 0.7,
                update(dt) { tm += dt; ang += w * dt; compute(); },
                hit: (hx, hy) => pts.some(p => circHit(p.x, p.y, cfg.r, hx, hy)),
                draw(c, ox, oy) { for (const p of pts) cfg.draw(c, ox + p.x, oy + p.y, p, tm); }
            };
        };
    }

    // ── perseguidores lentos (giran con inercia: se pueden esquivar) ──
    function atkChase(cfg) {
        return hard => {
            const n = hard ? cfg.n + 1 : cfg.n, v = cfg.v * (hard ? 1.15 : 1); let tm = 0;
            const mk = () => {
                const s = aint(0, 3);
                return { x: s === 2 ? -8 : s === 3 ? BOX_W + 8 : arnd(0, BOX_W), y: s === 0 ? -8 : s === 1 ? BOX_H + 8 : arnd(0, BOX_H), vx: 0, vy: 0, life: cfg.life * arnd(0.8, 1.2), age: -0.25, ph: arnd(0, 6) };
            };
            const es = Array.from({ length: n }, (_, i) => { const e = mk(); e.age = -0.4 - i * 0.55; return e; });
            return {
                label: cfg.label, dmg: cfg.dmg || 8, grace: cfg.grace || 0.7,
                update(dt, _t, hx, hy) {
                    tm += dt;
                    for (const e of es) {
                        e.age += dt;
                        if (e.age < 0) continue;
                        if (e.age > e.life) { Object.assign(e, mk()); continue; }
                        const dx = hx - e.x, dy = hy - e.y, d = Math.hypot(dx, dy) || 1, k = Math.min(1, dt * cfg.turn);
                        e.vx += (dx / d * v - e.vx) * k; e.vy += (dy / d * v - e.vy) * k;
                        e.x += e.vx * dt; e.y += e.vy * dt;
                    }
                },
                hit: (hx, hy) => es.some(e => e.age >= 0 && circHit(e.x, e.y, cfg.r, hx, hy)),
                draw(c, ox, oy) { for (const e of es) if (e.age >= 0) cfg.draw(c, ox + e.x, oy + e.y, e, tm); }
            };
        };
    }

    // ── muros con un hueco que avanzan ('v' bajan, 'h' cruzan de lado) ──
    function atkWalls(cfg) {
        return hard => {
            const vert = cfg.o === 'v', lim = vert ? BOX_W : BOX_H, GW = cfg.gapW * (hard ? 0.9 : 1), TH = cfg.th, V = cfg.v * (hard ? 1.15 : 1), END = (vert ? BOX_H : BOX_W) + TH;
            let timer = cfg.first || 0.5, tm = 0, last = lim / 2; const ws = [];
            return {
                label: cfg.label, dmg: cfg.dmg || 8, grace: cfg.grace || 0.6,
                update(dt) {
                    tm += dt; timer -= dt;
                    if (timer <= 0) {
                        timer = cfg.space / V;
                        last = aclamp(last + arnd(-cfg.shift, cfg.shift), GW / 2 + 4, lim - GW / 2 - 4);
                        ws.push({ p: last, pos: -TH });
                    }
                    for (let i = ws.length - 1; i >= 0; i--) { ws[i].pos += V * dt; if (ws[i].pos > END) ws.splice(i, 1); }
                },
                hit: (hx, hy) => ws.some(w => {
                    const a = vert ? hy : hx, b = vert ? hx : hy;
                    const pos = cfg.rev ? (END - TH) - w.pos : w.pos;
                    return a > pos - HEART_R && a < pos + TH + HEART_R && Math.abs(b - w.p) > GW / 2 - HEART_R;
                }),
                draw(c, ox, oy) {
                    for (const w of ws) {
                        const pos = cfg.rev ? (END - TH) - w.pos : w.pos, g0 = w.p - GW / 2, g1 = w.p + GW / 2;
                        const segs = vert ? [[0, pos, g0, TH], [g1, pos, BOX_W - g1, TH]] : [[pos, 0, TH, g0], [pos, g1, TH, BOX_H - g1]];
                        for (const s of segs) if (s[2] > 0 && s[3] > 0) cfg.draw(c, ox + s[0], oy + s[1], s[2], s[3], w, tm);
                    }
                }
            };
        };
    }

    // ── ráfagas: anillos o abanicos de proyectiles desde emisores avisados ──
    function atkBurst(cfg) {
        return hard => {
            const ems = cfg.em.map(e => ({ x: e[0], y: e[1], t: (cfg.first || 0.9) + (e[2] || 0) })), bs = [], v = cfg.v * (hard ? 1.15 : 1);
            let tm = 0, spin = arnd(0, 6.283);
            return {
                label: cfg.label, dmg: cfg.dmg || 8, grace: cfg.grace || 0.6,
                update(dt, _t, hx, hy) {
                    tm += dt;
                    for (const e of ems) {
                        e.t -= dt;
                        if (e.t > 0) continue;
                        e.t = cfg.gap * (hard ? 0.82 : 1);
                        const n = hard ? cfg.n + 1 : cfg.n;
                        const base = cfg.aim ? Math.atan2(hy - e.y, hx - e.x) : spin;
                        for (let k = 0; k < n; k++) {
                            const a = cfg.aim ? base + (k - (n - 1) / 2) * cfg.spread : base + k * 6.283 / n;
                            bs.push({ x: e.x, y: e.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, a, ph: arnd(0, 6) });
                        }
                        if (!cfg.aim) spin += cfg.spin;
                    }
                    for (let i = bs.length - 1; i >= 0; i--) { const b = bs[i]; b.x += b.vx * dt; b.y += b.vy * dt; if (!aIn(b.x, b.y, 18)) bs.splice(i, 1); }
                },
                hit: (hx, hy) => bs.some(b => aIn(b.x, b.y, 1) && circHit(b.x, b.y, cfg.r, hx, hy)),
                draw(c, ox, oy) {
                    for (const e of ems) if (e.t < 0.5) { const k = 1 - e.t / 0.5; c.strokeStyle = cfg.col; c.lineWidth = 2; c.beginPath(); c.arc(ox + e.x, oy + e.y, 4 + 10 * k, 0, 7); c.stroke(); }
                    for (const b of bs) cfg.draw(c, ox + b.x, oy + b.y, b, tm);
                }
            };
        };
    }

    // ── ondas: hileras de objetos que viajan siguiendo una curva ──
    function atkWave(cfg) {
        return hard => {
            let tm = 0; const st = [], cnt = Math.ceil((BOX_W + 24) / cfg.sp) + 1, vv = cfg.v * (hard ? 1.18 : 1);
            cfg.rows.forEach((by, i) => {
                const dir = cfg.alt && i % 2 ? -1 : 1;
                for (let k = 0; k < cnt; k++) st.push({ dir, x: k * cfg.sp - i * 13, by, ph: i * (cfg.phStep ?? 1.7), y: by, k: k + i });
            });
            return {
                label: cfg.label, dmg: cfg.dmg || 8, grace: cfg.grace || 0.6,
                update(dt) {
                    tm += dt;
                    for (const s of st) {
                        s.x += s.dir * vv * dt;
                        if (s.dir > 0 && s.x > BOX_W + 12) s.x -= cnt * cfg.sp;
                        if (s.dir < 0 && s.x < -12) s.x += cnt * cfg.sp;
                        s.y = s.by + Math.sin(s.x * cfg.freq + tm * cfg.sw + s.ph) * cfg.amp;
                    }
                },
                hit: (hx, hy) => st.some(s => aIn(s.x, s.y, 1) && circHit(s.x, s.y, cfg.r, hx, hy)),
                draw(c, ox, oy) { for (const s of st) if (aIn(s.x, s.y, 12)) cfg.draw(c, ox + s.x, oy + s.y, s, tm); }
            };
        };
    }

    // ═════════ MATEMÁTICAS ═════════
    ATTACKS.fractionRain = atkFall({ label:'¡Esquiva las fracciones!', n:11, v:[55, 85], r:7, dirs:['down', 'up'], wob:[9, 3.2],

    // ════════════════ QUÉ ATAQUES USA CADA ENEMIGO ════════════════
    // Cada materia tiene 4 ataques "normales" que usan los enemigos comunes y los jefes de ala.
    // Cada Guardián (jefe final) además tiene su ataque EXCLUSIVO, que ningún otro enemigo usa,
    // y puede lanzar cualquiera de los 5 de su materia (elige uno distinto en cada turno).
    const ATTACK_POOLS = {
        math:     ['mathRain', 'compassSpin', 'circleWaves', 'gridFlash'],
        language: ['pencilWrite', 'strikeThrough', 'inkBlots', 'wordSnake'],
        history:  ['rollingScrolls', 'arrowRain', 'pendulums', 'closingWalls'],
        science:  ['bouncingMolecules', 'popBubbles', 'gravityWell', 'stormBolts']
    };
    const BOSS_ONLY = { math:['equationBeams'], language:['letterWaves'], history:['dinoCharge'], science:['atomOrbit'] };

    // Los enemigos flojos usan solo los primeros ataques nuevos de su materia; los fuertes, los 10.
    function attackPoolFor(def, subjOverride) {
        const s0 = subjOverride || def.subject, subj = ATTACK_POOLS[s0] ? s0 : 'math';
        const tier = (def.boss || def.mini) ? 4 : (def.tier || 2), nNew = ({ 1:3, 2:5, 3:8, 4:10 })[tier] || 5;
        let pool = ATTACK_POOLS[subj].concat(ATTACK_NEW[subj].slice(0, nNew));
        if (def.boss && !subjOverride) pool = pool.concat(BOSS_ONLY[subj]);          // solo los Guardianes
        return pool;
    }
    function pickAttack(def, last) {
        let pool;
        if (def.mixed) pool = ALLY_KEYS.flatMap(s => attackPoolFor(def, s)).concat(['equationBeams', 'letterWaves', 'dinoCharge', 'atomOrbit']);   // Director Olvido: de todo
        else if (def.tower && Math.random() < (def.boss ? 0.4 : 0.3)) {                // Torre: a veces usan ataques de otra materia
            const others = ALLY_KEYS.filter(s => s !== def.subject);
            pool = attackPoolFor(def, others[Math.floor(Math.random() * others.length)]);
        } else pool = attackPoolFor(def);
        const opts = pool.length > 1 ? pool.filter(k => k !== last) : pool;
        return opts[Math.floor(Math.random() * opts.length)];
    }

    const hasAlly = s => !!((gmeta.allies && gmeta.allies[s]) || defeatedIds[ALLIES[s].id]);

    // Se llama al ganar un combate: si era un Guardián, se une a tu equipo
    function allyJoin(def) {

    function battleMenuNav() {
        const n = BATTLE_MENU.length, i = battle.menuIndex;
        if (navLeft)  battle.menuIndex = (i + n - 1) % n;
        if (navRight) battle.menuIndex = (i + 1) % n;
        if (navDown && i < 3) battle.menuIndex = Math.min(i + 3, n - 1);

    function openBattleAllies() {
        if (!allyRoster().length) {
            battle.message = 'Aún no tienes aliados. Calma a un Guardián y se unirá a ti para siempre.'; battle.msgTimer = 0; battle.phase = 'MESSAGE';
            battle.msgCb = () => { battle.phase = 'MENU'; };

    }

    function useAlly(k) {
        const a = ALLIES[k];
        if (!allyReady(k)) { battle.allyNote = `${a.name} se recupera: faltan ${battle.allyCd[k]} turno(s).`; return; }
        battle.allyCd[k] = a.cd + 1;                       // +1: se descuenta al terminar este mismo turno
        battle.fx = { k, until: performance.now() + 900 };
        stats.allies = (stats.allies | 0) + 1;
        const jit = () => arnd(0.9, 1.1); let msg = '', dmg = 0, freeze = false;
        if (k === 'math')          { dmg = Math.round((24 + lv * 1.6) * jit()); msg = `¡${a.name} usa CÁLCULO EXACTO! -${dmg} HP al enemigo.`; }
        else if (k === 'language') { battle.shield = Math.max(battle.shield | 0, 2); msg = `¡${a.name} levanta un ESCUDO DE PALABRAS! Bloqueará los próximos 2 golpes.`; }
        else if (k === 'history')  { dmg = Math.round((10 + lv * 0.8) * jit()); freeze = true; msg = `¡${a.name} CONGELA EL TIEMPO! -${dmg} HP y ${battle.enemyName} pierde su próximo ataque.`; }
        else if (k === 'science')  { const before = player.hp; player.hp = Math.min(player.maxHp, player.hp + Math.max(30, Math.round(player.maxHp * 0.35))); msg = `¡${a.name} lanza una REACCIÓN CURATIVA! +${player.hp - before} HP.`; }
        else {
            dmg = Math.round(55 + lv * 2.2); const before = player.hp; player.hp = Math.min(player.maxHp, player.hp + Math.round(player.maxHp * 0.25)); battle.shield = Math.max(battle.shield | 0, 1);
            msg = `¡Los 4 Guardianes unen su saber: SABER TOTAL! -${dmg} HP, +${player.hp - before} HP y un escudo.`;
        }
        if (dmg) battle.enemyHp = Math.max(0, battle.enemyHp - dmg);
        sfxTone(880, 0.12, { vol:0.05 }); setTimeout(() => sfxTone(1175, 0.14, { vol:0.05 }), 110);
        battle.message = msg; battle.msgTimer = 0; battle.phase = 'MESSAGE';
        battle.msgCb = () => {
            if (battle.enemyHp <= 0) { startVictory(); return; }
            if (freeze) {
                battle.message = `${battle.enemyName} se queda inmóvil... ¡pierde su turno!`; battle.phase = 'MESSAGE';
                battle.msgCb = () => { tickAllyCd(); battle.phase = 'MENU'; };

    // Aliados dibujados en el escenario, a la izquierda del enemigo

                ctx.drawImage(im, x + Math.round((52 - w) / 2), base - h + hop, w, h); ctx.imageSmoothingEnabled = ps;
            } else { ctx.fillStyle = a.col; ctx.fillRect(x + 10, base - 40 + hop, 32, 40); }

    function battleAlliesTap(x, y, bx, by, bw, bh) {

        if (x >= bx + bw - 130 && x < bx + bw - 18 && y >= by + bh - 34 && y < by + bh - 10) { battle.phase = 'MENU'; return; }
        for (let i = 0; i < l.length; i++) {

            if (y >= ry - 14 && y < ry + 5 && x >= bx && x < bx + bw) { if (battle.allyIdx === i) useAlly(l[i]); else { battle.allyIdx = i; battle.allyNote = ''; } return; }

    function updateDodge(dt) {
        battle.dodgeTimer -= dt;
        if (battle.hitCooldown > 0) battle.hitCooldown -= dt;
        if (battle.grace > 0) battle.grace -= dt;

        const sx = 150 / BOX_W * dt, sy = 150 / BOX_H * dt;      // el corazón se mueve 150 px/s
        if (keys.ArrowLeft  || keys.KeyA) battle.heart.x -= sx;
        if (keys.ArrowRight || keys.KeyD) battle.heart.x += sx;
        if (keys.ArrowUp    || keys.KeyW) battle.heart.y -= sy;
        if (keys.ArrowDown  || keys.KeyS) battle.heart.y += sy;
        if (battle.atk && battle.atk.push && battle.grace <= 0) {                        // ataques que arrastran al corazón
            const f = battle.atk.push(battle.heart.x * BOX_W, battle.heart.y * BOX_H);
            battle.heart.x += f.x * dt / BOX_W; battle.heart.y += f.y * dt / BOX_H;
        }
        battle.heart.x = Math.max(6 / BOX_W, Math.min(1 - 6 / BOX_W, battle.heart.x));
        battle.heart.y = Math.max(6 / BOX_H, Math.min(1 - 6 / BOX_H, battle.heart.y));

        const hx = battle.heart.x * BOX_W, hy = battle.heart.y * BOX_H;
        const atk = battle.atk;
        if (atk) {
            atk.update(dt, 0, hx, hy);
            if (battle.hitCooldown <= 0 && battle.grace <= 0 && atk.hit(hx, hy)) {
                if (battle.shield > 0) { battle.shield--; sfxTone(700, 0.08, { vol:0.05 }); }          // escudo de palabras
                else if (!dev.god) player.hp = Math.max(0, player.hp - (atk.dmg || 8));
                battle.hitCooldown = 0.6;
            }
        }

        if (player.hp <= 0) { triggerGameOver(); return; }
        if (battle.dodgeTimer <= 0) {
            if (battle.chainLeft > 0) { battle.chainLeft--; startEnemyTurn(true); }
            else { battle.phase = 'MENU'; tickAllyCd(); }
        }
    }

    function updateBattle(dt) {
        switch (battle.phase) {
            case 'MENU':
                battleMenuNav();
                if (interact) {
                    const choice = BATTLE_MENU[battle.menuIndex];
                    if (choice === 'ATACAR')        startAttack();
                    else if (choice === 'ACTUAR')   { if (battle.enemyDef && battle.enemyDef.boss) startMech(); else startQuiz(); }
                    else if (choice === 'ITEM')     openBattleItems();
                    else if (choice === 'ALIADOS')  openBattleAllies();
                    else if (choice === 'PERDONAR') tryMercy();
                }
                break;
            case 'ATTACK_BAR':
                updateAttackBar(dt);
                break;
            case 'QUIZ_QUESTION':
                updateQuizQuestion();
                break;
            case 'QUIZ_FEEDBACK':
                if (interact) advanceQuiz();
                break;
            case 'MECH':
                updateMech(dt);
                break;
            case 'MECH_FB':
                if (interact) advanceMech();
                break;
            case 'ITEMS': {
                const n = inventory.length;
                if (!n) { battle.phase = 'MENU'; break; }
                if (navUp)   battle.itemIdx = (battle.itemIdx + n - 1) % n;
                if (navDown) battle.itemIdx = (battle.itemIdx + 1) % n;
                if (interact) battleUseItem(battle.itemIdx);
                break;
            }
            case 'ALLIES': {
                const l = allyRoster(), n = l.length;
                if (!n) { battle.phase = 'MENU'; break; }
                if (navUp)   { battle.allyIdx = (battle.allyIdx + n - 1) % n; battle.allyNote = ''; }
                if (navDown) { battle.allyIdx = (battle.allyIdx + 1) % n; battle.allyNote = ''; }
                if (interact) useAlly(l[battle.allyIdx]);
                break;
            }
            case 'MESSAGE':
                if (interact && battle.msgCb) {
                    const cb = battle.msgCb;
                    battle.msgCb = null;
                    cb();
                }
                break;
            case 'ENEMY_TURN':
                updateDodge(dt);
                break;
            case 'VICTORY':
                if (interact) endBattle(true);
                break;
            case 'GAME_OVER':
                if (interact) endBattle(false, false);
                break;
        }
    }

    // ──────────────── Fundido ────────────────
    function startFade(cb) {
        if (fade.dir !== 0) return;
        fade.dir   = 1;
        fade.alpha = 0;
        fade.cb    = cb;
        state      = 'TRANSITION';
    }

    function updateFade(dt) {
        fade.alpha += fade.dir * dt * 3.5;
        if (fade.dir === 1 && fade.alpha >= 1) {
            fade.alpha = 1;
            if (fade.cb) { fade.cb(); fade.cb = null; }
            fade.dir = -1;
        }
        if (fade.dir === -1 && fade.alpha <= 0) {
            fade.alpha = 0;
            fade.dir   = 0;
            state      = 'EXPLORE';
        }
    }

    // ──────────────── Diálogo ────────────────
    function updateDialog(dt) {
        dlg.timer += dt;
        const line = dlg.lines[dlg.li];
        if (dlg.timer >= 0.03 && dlg.ci < line.length) {
            dlg.ci++;
            dlg.timer = 0;
        }
        if (interact) {
            if (dlg.ci < line.length) {
                dlg.ci = line.length;          // mostrar línea completa
            } else {
                dlg.li++;
                if (dlg.li >= dlg.lines.length) {
                    dlg.active = false;
                    if (dlg.onDone) {
                        const cb = dlg.onDone;
                        dlg.onDone = null;
                        cb();
                    } else {
                        state = 'EXPLORE';
                    }
                } else {
                    dlg.ci = 0;
                    dlg.timer = 0;
                }
            }
        }
    }

    // ──────────────── Cámara ────────────────
    function updateCamera(instant) {
        const mw = mapW * TILE, mh = mapH * TILE;
        let tx, ty;
        if (mw <= CW) tx = -(CW - mw) / 2;
        else           tx = Math.max(0, Math.min(player.x - CW / 2, mw - CW));
        if (mh <= CH) ty = -(CH - mh) / 2;
        else           ty = Math.max(0, Math.min(player.y - CH / 2, mh - CH));

        if (instant) { camera.x = tx; camera.y = ty; }
        else { camera.x = lerp(camera.x, tx, 0.15); camera.y = lerp(camera.y, ty, 0.15); }
    }

    // ──────────────── Dibujar tile ────────────────
    function drawTileBase(type, tx, ty, x, y) {
        const S = TILE;
        switch (type) {
            case FLOOR:
                ctx.fillStyle = (tx + ty) % 2 ? theme.f1 : theme.f2;
                ctx.fillRect(x, y, S, S);
                break;

            case WALL:
                ctx.fillStyle = theme.w;
                ctx.fillRect(x, y, S, S);
                ctx.fillStyle = theme.wt;
                if (ty % 2 === 0) {
                    ctx.fillRect(x + 1, y + 1, S / 2 - 2, S / 2 - 1);
                    ctx.fillRect(x + S / 2 + 1, y + 1, S / 2 - 2, S / 2 - 1);
                    ctx.fillRect(x + S / 4 + 1, y + S / 2 + 1, S / 2 - 2, S / 2 - 2);
                } else {
                    ctx.fillRect(x + S / 4 + 1, y + 1, S / 2 - 2, S / 2 - 1);
                    ctx.fillRect(x + 1, y + S / 2 + 1, S / 2 - 2, S / 2 - 2);
                    ctx.fillRect(x + S / 2 + 1, y + S / 2 + 1, S / 2 - 2, S / 2 - 2);
                }
                break;

            case DOOR:
                ctx.fillStyle = (tx + ty) % 2 ? theme.f1 : theme.f2;
                ctx.fillRect(x, y, S, S);
                ctx.fillStyle = theme.dr;
                ctx.fillRect(x + 4, y + 2, S - 8, S - 4);
                ctx.fillStyle = theme.ac;
                ctx.fillRect(x + 6, y + 4, S - 12, S - 8);
                ctx.fillStyle = '#ffdd44';
                ctx.fillRect(x + S - 12, y + S / 2 - 2, 3, 3);
                break;

            case DESK:
                ctx.fillStyle = (tx + ty) % 2 ? theme.f1 : theme.f2;
                ctx.fillRect(x, y, S, S);
                ctx.fillStyle = '#8B6914';
                ctx.fillRect(x + 3, y + 6, S - 6, S - 10);
                ctx.fillStyle = '#705510';
                ctx.fillRect(x + 5, y + 8, S - 10, S - 14);
                ctx.fillStyle = '#5a4010';
                ctx.fillRect(x + 4, y + S - 6, 3, 6);
                ctx.fillRect(x + S - 7, y + S - 6, 3, 6);
                break;

            case BOARD:
                ctx.fillStyle = theme.w;
                ctx.fillRect(x, y, S, S);
                ctx.fillStyle = '#1a3a1a';
                ctx.fillRect(x + 2, y + 4, S - 4, S - 8);
                ctx.strokeStyle = '#8B6914';
                ctx.lineWidth = 2;
                ctx.strokeRect(x + 2, y + 4, S - 4, S - 8);
                ctx.fillStyle = '#aaddaa';
                ctx.fillRect(x + 6, y + 10, 8, 2);
                ctx.fillRect(x + 10, y + 16, 10, 2);
                break;

            case LOCKER:
                ctx.fillStyle = theme.w;
                ctx.fillRect(x, y, S, S);
                ctx.fillStyle = '#667788';
                ctx.fillRect(x + 4, y + 2, S - 8, S - 4);
                ctx.strokeStyle = '#556677';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(x + S / 2, y + 2);
                ctx.lineTo(x + S / 2, y + S - 2);
                ctx.stroke();
                ctx.fillStyle = '#334455';
                ctx.fillRect(x + S / 2 - 4, y + S / 2 - 1, 2, 4);
                ctx.fillRect(x + S / 2 + 2, y + S / 2 - 1, 2, 4);
                break;

            case SHELF:
                ctx.fillStyle = (tx + ty) % 2 ? theme.f1 : theme.f2;
                ctx.fillRect(x, y, S, S);
                ctx.fillStyle = '#6B4226';
                ctx.fillRect(x + 2, y + 2, S - 4, S - 4);
                ctx.fillStyle = '#8B5A2B';
                ctx.fillRect(x + 3, y + 10, S - 6, 2);
                ctx.fillRect(x + 3, y + 20, S - 6, 2);

                }

            case LAB_T:
                ctx.fillStyle = (tx + ty) % 2 ? theme.f1 : theme.f2;

                ctx.fillRect(x + 2, y + 6, S - 4, S - 10);
                ctx.fillStyle = '#445566';
                ctx.fillRect(x + 4, y + 8, S - 8, S - 14);
                ctx.fillStyle = '#aaccee';
                ctx.fillRect(x + 8, y + 1, 6, 5);
                ctx.fillStyle = theme.ac;
                ctx.fillRect(x + 9, y + 2, 4, 3);
                ctx.fillStyle = '#334455';
                ctx.fillRect(x + 4, y + S - 6, 3, 6);
                ctx.fillRect(x + S - 7, y + S - 6, 3, 6);
                break;

            case PILLAR:
                ctx.fillStyle = (tx + ty) % 2 ? theme.f1 : theme.f2;

                ctx.fillStyle = '#8a8a9a';
